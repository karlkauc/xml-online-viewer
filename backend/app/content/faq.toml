# Home page FAQ: rendered into the static shell (crawlers, no-JS), as FAQPage
# JSON-LD, and available to the SPA via /api/content/faq. Answers are Markdown.

[[faq]]
q = "How do I validate an XML file against an XSD online?"
a = """
Drop the XML file here. If it names its schema in `xsi:schemaLocation` or `xsi:noNamespaceSchemaLocation`, the
schema and everything it imports is fetched and applied automatically; otherwise add the `.xsd` (or a `.zip` with
all schema files) in the schema panel. Validation runs immediately and every error is pinned to its node.
"""

[[faq]]
q = "Can I export the validation errors?"
a = """
Yes, as an Excel workbook: one row per error with severity, line, column, XML path, message, the line before, the
error line and the line after, and a link to an explanation of the error. See [Excel error report](/features/excel-report).
"""

[[faq]]
q = "Are my files stored?"
a = """
No. Files are parsed in memory and dropped from a short-lived cache; nothing is written to disk and document
content never reaches the usage statistics. To keep files inside your network,
[run the viewer with Docker](https://github.com/karlkauc/xml-online-viewer#self-host-with-docker).
"""

[[faq]]
q = "What does an error like cvc-complex-type.2.4.a mean?"
a = """
Each common validation error has a page with the libxml2 and Xerces wording, typical causes, an example and the
fix: [XML validation errors explained](/errors).
"""

[[faq]]
q = "Does it check Schematron or business rules?"
a = """
No — it validates against XML Schema (XSD 1.0): structure, data types, lengths, patterns and code lists.
Rules defined in Schematron (for example XRechnung) or in bank implementation guides need a separate validator.
"""
